<section class="container not-found">
  <div class="card not-found-card">

    <div class="not-found-illustration">
      
      <!-- Simple calm illustration placeholder -->
      <svg width="120" height="120" viewBox="0 0 120 120" fill="none">

        <!-- face circle -->
        <circle cx="60" cy="60" r="50" stroke="var(--secondary)" stroke-width="2" />

        <!-- eyes -->
        <circle cx="45" cy="50" r="3" fill="var(--primary)" />
        <circle cx="75" cy="50" r="3" fill="var(--primary)" />

        <!-- smile -->
        <path d="M30 70 Q60 90 90 70" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" />

      </svg>
    </div>

    <h1 class="not-found-code">404</h1>
    <h2>Page not found</h2>

    <p class="not-found-message">
      Take a breath… and restart. The page you’re looking for isn’t here.
    </p>

    <div class="not-found-actions">
      <button class="btn" [routerLink]="['/home']">Go Home</button>
      <button class="btn" [routerLink]="['/sessions-home']">Browse Sessions</button>
    </div>
  </div>
</section>
