<section class="container create-session">

  <div class="card">
    <h2>Create Your Session</h2>
    <p class="subtitle">Build a personalized yoga or pilates session step by step</p>
  </div>

  <form class="form create-form">

    <!-- STEP 1 -->
    <div class="card step-card">
      <h3>1. Choose Session Type</h3>

      <div class="option-group">
        <button type="button" class="option">🧘 Yoga</button>
        <button type="button" class="option">💪 Pilates</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="card step-card">
      <h3>2. Select Goal</h3>

      <div class="option-group">
        <button type="button" class="option">Strength</button>
        <button type="button" class="option">Flexibility</button>
        <button type="button" class="option">Recovery</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="card step-card">
      <h3>3. Choose Subcategory</h3>

      <div class="option-group">
        <button type="button" class="option">Vinyasa</button>
        <button type="button" class="option">Core Pilates</button>
      </div>
    </div>

 <!-- STEP 4 -->
<div class="card step-card">
  <h3>4. Session Details</h3>

  <!-- NEW: session name -->
  <input type="text" placeholder="Session Name" />

  <input type="text" placeholder="Short Description" />

  <textarea placeholder="Detailed Description"></textarea>

  <input type="number" placeholder="Duration (minutes)" />
</div>

    <!-- STEP 5 -->
    <div class="card step-card">
      <h3>5. Exercises</h3>

      <div class="exercise-list">
        <input type="text" placeholder="Exercise name" />
        <input type="text" placeholder="Exercise name" />
      </div>
    </div>

    <!-- STEP 6 -->
    <div class="card step-card">
      <h3>6. Music</h3>

      <input type="text" placeholder="Music URL (Spotify, YouTube...)" />
    </div>

    <!-- SUBMIT -->
    <div class="card">
      <button class="btn full-btn">Save Session</button>
    </div>

  </form>
</section>
