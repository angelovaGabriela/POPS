<section class="container sessions-home">

  <!-- HERO -->
  <div class="card" appLiquidCard>
    <h2>Session trends</h2>
    <p class="subtitle">
      Create, explore, and organize your yoga & pilates sessions.
    </p>

    <div class="hero-actions">
      <button class="btn" [routerLink]="['/create-session']">Create Session</button>
      <button class="btn" [routerLink]="['/dashboard']">My Sessions</button>
    </div>
  </div>

  <!-- RECOMMENDED -->
  <div class="card" appLiquidCard>
    <h3>Recommended for you</h3>

    <div class="grid sessions-grid">
      <app-session-item></app-session-item>
      <app-session-item></app-session-item>
    </div>
  </div>

  <!-- BROWSE BY GOAL -->
  <div class="card" appLiquidCard>
    <h3>Browse by goal</h3>

    <div class="grid goal-grid">
      <div class="card goal-card">
        <h4>🧘 Flexibility</h4>
        <p>Improve mobility and stretching.</p>
        <button class="btn" routerLink="/dashboard">View</button>
      </div>

      <div class="card goal-card">
        <h4>💪 Strength</h4>
        <p>Build core and muscle control.</p>
        <button class="btn" routerLink="/dashboard">View</button>
      </div>

      <div class="card goal-card">
        <h4>🌿 Recovery</h4>
        <p>Relax and restore your body.</p>
        <button class="btn" routerLink="/dashboard">View</button>
      </div>
    </div>
  </div>

</section>
